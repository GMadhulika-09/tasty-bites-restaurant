<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- FAQ Section -->

<section class="faq">

    <h2 class="section-title">Frequently Asked Questions</h2>

    <div class="faq-item">
        <button class="faq-question">Do you provide home delivery?</button>
        <div class="faq-answer">
            <p>Yes, we deliver within our service area.</p>
        </div>
    </div>

    <div class="faq-item">
        <button class="faq-question">Can I reserve a table?</button>
        <div class="faq-answer">
            <p>Yes, you can reserve a table by contacting us.</p>
        </div>
    </div>

    <div class="faq-item">
        <button class="faq-question">What are your opening hours?</button>
        <div class="faq-answer">
            <p>We are open daily from 10:00 AM to 11:00 PM.</p>

        </div>
    </div>
    <div class="faq-item">
        <button class="faq-question">Do you offer catering services?</button>
        <div class="faq-answer">
            <p>Yes, we provide catering for events and parties.</p>
        </div>

</section>
</body>
</html>
